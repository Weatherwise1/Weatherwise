<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weatherwise — Hyderabad Micro-Climate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root { --accent: #C9701C; --cloud-color: rgba(255,255,255,0.55); }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow-x: hidden;
    position: relative;
  }
  .font-display { font-family: 'Space Grotesk', sans-serif; }
  .font-mono { font-family: 'IBM Plex Mono', monospace; }

  #radar-map { height: 340px; border-radius: 1.25rem; }

  #bg-decor {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }

  .stars { position: absolute; inset: 0; opacity: 0; transition: opacity 1s ease; }
  .stars.visible { opacity: 1; }
  .star {
    position: absolute; width: 2px; height: 2px; background: #fff;
    border-radius: 50%; animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }

  .cloud-layer { position: absolute; inset: 0; }
  .cloud {
    position: absolute; fill: var(--cloud-color);
    animation: floatCloud linear infinite; transition: fill 0.8s ease;
  }
  .cloud.c1 { width: 200px; top: 6%; animation-duration: 75s; opacity: .6; }
  .cloud.c2 { width: 130px; top: 16%; animation-duration: 100s; animation-delay: -25s; opacity: .45; }
  .cloud.c3 { width: 240px; top: 3%; animation-duration: 130s; animation-delay: -60s; opacity: .35; }
  .cloud.c4 { width: 110px; top: 24%; animation-duration: 65s; animation-delay: -10s; opacity: .5; }
  @keyframes floatCloud {
    from { transform: translateX(-30%); }
    to { transform: translateX(130%); }
  }

  .glow-field {
    position: absolute; inset: -20% -10% auto -10%; height: 480px;
    z-index: 0; pointer-events: none; filter: blur(60px);
  }
  .glow-blob {
    position: absolute; border-radius: 9999px; opacity: 0.55;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .glow-blob.b2 { animation-duration: 24s; animation-delay: -6s; }
  .glow-blob.b3 { animation-duration: 30s; animation-delay: -12s; }
  @keyframes drift {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(4%, 6%) scale(1.08); }
    100% { transform: translate(-5%, -3%) scale(0.96); }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow-blob, .cloud, .star { animation: none; }
    * { transition: none !important; }
  }

  .fade-in { animation: fadeIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .fade-in.delay-1 { animation-delay: 0.08s; }
  .fade-in.delay-2 { animation-delay: 0.16s; }
  .fade-in.delay-3 { animation-delay: 0.24s; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-hover { transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease; }
  .card-hover:hover { transform: translateY(-3px); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #locality-select {
    appearance: none;
    -webkit-appearance: none;
  }
</style>
</head>
<body class="min-h-screen transition-colors duration-700" id="page-body">

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="cloud-shape" viewBox="0 0 200 100">
      <path d="M50,90 Q10,90 10,60 Q10,30 45,30 Q50,10 80,10 Q115,10 120,35 Q150,35 155,60 Q160,90 120,90 Z"/>
    </symbol>
  </defs>
</svg>

<div id="bg-decor">
  <div class="stars" id="stars"></div>
  <div class="cloud-layer">
    <svg class="cloud c1"><use href="#cloud-shape"></use></svg>
    <svg class="cloud c2"><use href="#cloud-shape"></use></svg>
    <svg class="cloud c3"><use href="#cloud-shape"></use></svg>
    <svg class="cloud c4"><use href="#cloud-shape"></use></svg>
  </div>
</div>

<div class="max-w-2xl mx-auto px-6 py-10 sm:py-16 relative z-10">

  <div class="glow-field" id="glow-field">
    <div class="glow-blob b1" style="width:280px;height:280px;left:10%;top:0;"></div>
    <div class="glow-blob b2" style="width:220px;height:220px;right:8%;top:10%;"></div>
    <div class="glow-blob b3" style="width:200px;height:200px;left:40%;top:20%;"></div>
  </div>

  <!-- Locality Picker -->
  <div class="relative z-10 flex flex-col items-center gap-2 mb-7">
    <div class="fade-in flex items-center gap-2 border border-current/20 rounded-full px-4 py-1.5 bg-white/10 backdrop-blur-sm">
      <i data-lucide="map-pin" class="w-3.5 h-3.5 opacity-60"></i>
      <select id="locality-select" class="text-xs uppercase tracking-[0.2em] font-medium bg-transparent opacity-80 cursor-pointer focus:opacity-100 pr-2"></select>
    </div>
    <span id="confidence-badge" class="text-[10px] font-mono tracking-wider opacity-60 uppercase bg-black/10 px-2.5 py-0.5 rounded-full border border-current/10">
      Multi-Source Consensus
    </span>
  </div>

  <!-- Hero -->
  <div class="relative z-10">
    <div class="fade-in delay-1 flex items-center justify-center gap-4 mb-6">
      <i data-lucide="cloud-rain" id="hero-icon" class="w-14 h-14 sm:w-16 sm:h-16" stroke-width="1.4"></i>
      <span class="font-display text-7xl sm:text-8xl font-bold tracking-tight" id="hero-temp">--°C</span>
    </div>

    <p class="fade-in delay-2 font-display text-2xl sm:text-3xl md:text-4xl font-bold leading-[1.2] text-center max-w-xl mx-auto" id="hero-summary">
      Loading micro-climate data...
    </p>
  </div>

  <!-- Timeline -->
  <div class="relative z-10 grid grid-cols-2 sm:grid-cols-4 gap-3 my-10 sm:my-14" id="timeline"></div>

  <!-- Live Radar Map -->
  <div class="relative z-10 mb-10">
    <div class="flex items-center justify-between mb-3">
      <p class="text-xs uppercase tracking-wide font-medium opacity-60">Doppler Rain Radar & Nowcast</p>
      <span id="radar-timestamp" class="text-[11px] font-mono opacity-70 bg-white/20 backdrop-blur-sm px-2.5 py-0.5 rounded-md border border-current/10">
        Loading Doppler feed...
      </span>
    </div>
    <div id="radar-map" class="border border-current/10 shadow-lg"></div>
    <p class="text-xs opacity-50 mt-2">
      Data: IMD Doppler / RainViewer. Real-time clouds & 30-min predictive nowcast.
    </p>
  </div>

  <!-- Technical Details Panel -->
  <div class="relative z-10 pb-4">
    <button id="tech-toggle" class="w-full flex items-center justify-between px-4 py-3 rounded-xl border border-current/10 bg-white/30 backdrop-blur-sm text-sm font-medium opacity-70 card-hover">
      <span>Show Technical & Model Details</span>
      <i data-lucide="chevron-down" id="tech-chevron" class="w-4 h-4 transition-transform"></i>
    </button>
    <div id="tech-panel" class="hidden mt-3 rounded-xl border border-current/10 bg-white/30 backdrop-blur-sm p-4 grid grid-cols-2 gap-4 text-sm font-mono">
      <div><p class="opacity-50 text-xs">Humidity</p><p class="font-medium" id="stat-humidity">--</p></div>
      <div><p class="opacity-50 text-xs">Wind Speed</p><p class="font-medium" id="stat-wind">--</p></div>
      <div><p class="opacity-50 text-xs">Chance of Rain</p><p class="font-medium" id="stat-rain">--</p></div>
      <div><p class="opacity-50 text-xs">Radar Resolution</p><p class="font-medium">1.0 km Doppler</p></div>
      <div class="col-span-2"><p class="opacity-50 text-xs">Last Updated</p><p class="font-medium" id="stat-updated">--</p></div>
    </div>
  </div>

</div>

<script>
const LOCALITIES = [
  { name: "Hyderabad (Central)", lat: 17.3850, lon: 78.4867 },
  { name: "Gachibowli",          lat: 17.4401, lon: 78.3489 },
  { name: "Banjara Hills",       lat: 17.4156, lon: 78.4347 },
  { name: "Madhapur",            lat: 17.4483, lon: 78.3915 },
  { name: "Hitech City",         lat: 17.4435, lon: 78.3772 },
  { name: "Secunderabad",        lat: 17.4399, lon: 78.4983 },
  { name: "Malakpet",            lat: 17.3702, lon: 78.4990 },
  { name: "Kukatpally",          lat: 17.4849, lon: 78.4138 },
  { name: "Kondapur",            lat: 17.4615, lon: 78.3672 },
  { name: "Charminar",           lat: 17.3616, lon: 78.4747 },
  { name: "Uppal",               lat: 17.4058, lon: 78.5591 },
];

const fallbackData = {
  temp: 24, condition: "rainy", isDay: true, humidity: 85, wind: 15, chanceOfRain: 62,
  locationName: "Hyderabad (Central)", updated: "--:--",
  periods: [
    { name: "Morning", icon: "cloud", temp: 22, condition: "Overcast" },
    { name: "Afternoon", icon: "cloud-rain", temp: 24, condition: "Heavy Rain" },
    { name: "Evening", icon: "cloud-rain", temp: 21, condition: "Showers" },
    { name: "Night", icon: "cloud-moon", temp: 19, condition: "Drizzle" },
  ],
};

function weatherCodeToCondition(code) {
  if (code === 0) return "clear";
  if ([1, 2, 3, 45, 48].includes(code)) return "cloudy";
  return "rainy";
}

function weatherCodeLabel(code) {
  const map = {
    0: "Clear", 1: "Mostly Clear", 2: "Partly Cloudy", 3: "Overcast",
    45: "Fog", 48: "Fog", 51: "Drizzle", 53: "Drizzle", 55: "Drizzle",
    61: "Light Rain", 63: "Rain", 65: "Heavy Rain",
    80: "Showers", 81: "Showers", 82: "Heavy Showers",
    95: "Thunderstorm", 96: "Thunderstorm", 99: "Thunderstorm",
  };
  return map[code] || "Cloudy";
}

function iconForCondition(cond, isNight) {
  if (cond === "clear") return isNight ? "moon" : "sun";
  if (cond === "cloudy") return isNight ? "cloud-moon" : "cloud-sun";
  return isNight ? "cloud-moon-rain" : "cloud-sun-rain";
}

function generateSummary({ temp, condition, chanceOfRain, isDay }) {
  const t = isDay ? "today" : "tonight";
  if (condition === "rainy" && chanceOfRain > 50) {
    return `Micro-burst showers probable ${t}. Up to ${chanceOfRain}% chance in your immediate locality.`;
  }
  if (condition === "rainy") {
    return `Isolated scattered showers expected ${t}. Heavy pockets may occur within a mile.`;
  }
  if (condition === "clear" && isDay && temp >= 33) {
    return `Hot and sunny ${t} at ${temp}°C. Clear radar across the metro area.`;
  }
  if (condition === "clear") {
    return `Clear skies ${t} at ${temp}°C. Minimal rain threat across all sectors.`;
  }
  return `Overcast ${t} at ${temp}°C. Cloud cover active, but no heavy precipitation detected.`;
}

const themes = {
  clear: {
    day:   { bg: "bg-gradient-to-b from-[#FDF6E3] to-[#F5D590] text-[#402F1C]", icon: "sun",  accent: "#C9701C", glow: ["#F7B733", "#F5D590", "#E8942C"], cloud: "rgba(255,255,255,0.6)" },
    night: { bg: "bg-gradient-to-b from-[#0B1024] to-[#030712] text-[#E5E7EB]", icon: "moon", accent: "#A5B4FC", glow: ["#6366F1", "#818CF8", "#3730A3"], cloud: "rgba(148,163,184,0.25)" },
  },
  cloudy: {
    day:   { bg: "bg-gradient-to-b from-[#E4E7EB] to-[#C7CCD1] text-[#2B2F36]", icon: "cloud",      accent: "#64748B", glow: ["#AEB6BF", "#CBD2D9", "#9AA5B1"], cloud: "rgba(255,255,255,0.65)" },
    night: { bg: "bg-gradient-to-b from-[#1F2937] to-[#111827] text-[#E5E7EB]", icon: "cloud-moon", accent: "#94A3B8", glow: ["#475569", "#64748B", "#334155"], cloud: "rgba(100,116,139,0.35)" },
  },
  rainy: {
    day:   { bg: "bg-gradient-to-b from-[#1B2A4A] to-[#0B1220] text-[#F1F5F9]", icon: "cloud-rain",      accent: "#5EEAD4", glow: ["#3B5A8A", "#5EEAD4", "#1E3A5F"], cloud: "rgba(148,163,184,0.45)" },
    night: { bg: "bg-gradient-to-b from-[#0F172A] to-[#020617] text-[#F1F5F9]", icon: "cloud-moon-rain", accent: "#38BDF8", glow: ["#1E3A8A", "#38BDF8", "#0F172A"], cloud: "rgba(71,85,105,0.5)" },
  },
};

/* Map Setup */
const map = L.map("radar-map", {
  zoomControl: true, attributionControl: false, minZoom: 6, maxZoom: 11,
}).setView([17.385, 78.4867], 10);

let baseLayer = null;
let localityMarker = null;

function setBaseLayer(dark) {
  if (baseLayer) map.removeLayer(baseLayer);
  const style = dark ? "dark_all" : "light_all";
  baseLayer = L.tileLayer(`https://{s}.basemaps.cartocdn.com/${style}/{z}/{x}/{y}{r}.png`, {
    subdomains: "abcd",
  }).addTo(map);
}

function recenterMap(lat, lon) {
  map.setView([lat, lon], 11);
  if (localityMarker) map.removeLayer(localityMarker);
  localityMarker = L.circleMarker([lat, lon], {
    radius: 7, color: "#fff", weight: 2.5, fillColor: "#38BDF8", fillOpacity: 1,
  }).addTo(map);
}

function buildStars() {
  const container = document.getElementById("stars");
  container.innerHTML = "";
  for (let i = 0; i < 30; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.style.top = Math.random() * 60 + "%";
    s.style.left = Math.random() * 100 + "%";
    s.style.animationDelay = (Math.random() * 3).toFixed(2) + "s";
    container.appendChild(s);
  }
}
buildStars();

function buildPeriods(hourly) {
  const dateStr = hourly.time[0].split("T")[0];
  const defs = [
    { name: "Morning", hour: 9, night: false },
    { name: "Afternoon", hour: 14, night: false },
    { name: "Evening", hour: 18, night: false },
    { name: "Night", hour: 23, night: true },
  ];
  return defs.map((d) => {
    const target = `${dateStr}T${d.hour.toString().padStart(2, '0')}:00`;
    const idx = hourly.time.indexOf(target) === -1 ? 0 : hourly.time.indexOf(target);
    const code = hourly.weather_code[idx];
    const cond = weatherCodeToCondition(code);
    return {
      name: d.name,
      icon: iconForCondition(cond, d.night),
      temp: Math.round(hourly.temperature_2m[idx]),
      condition: weatherCodeLabel(code),
    };
  });
}

async function fetchOpenMeteo(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,is_day` +
    `&hourly=temperature_2m,precipitation_probability,weather_code` +
    `&forecast_days=1&timezone=Asia%2FKolkata`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("Open-Meteo request failed");
  return res.json();
}

function transformOpenMeteo(raw, name) {
  const cur = raw.current;
  const conditionKey = weatherCodeToCondition(cur.weather_code);
  const isDay = cur.is_day === 1;

  const prefix = cur.time.slice(0, 13);
  let nowIdx = raw.hourly.time.findIndex((t) => t.startsWith(prefix));
  if (nowIdx === -1) nowIdx = 0;
  const next6 = raw.hourly.precipitation_probability.slice(nowIdx, nowIdx + 6);
  const chanceOfRain = next6.length ? Math.max(...next6) : 0;

  return {
    temp: Math.round(cur.temperature_2m),
    condition: conditionKey,
    isDay,
    humidity: cur.relative_humidity_2m,
    wind: Math.round(cur.wind_speed_10m),
    chanceOfRain,
    periods: buildPeriods(raw.hourly),
    locationName: name,
    updated: cur.time.slice(11, 16),
  };
}

function render(data) {
  const theme = themes[data.condition][data.isDay ? "day" : "night"];

  document.getElementById("page-body").className = "min-h-screen transition-colors duration-700 " + theme.bg;
  document.documentElement.style.setProperty("--accent", theme.accent);
  document.documentElement.style.setProperty("--cloud-color", theme.cloud);

  document.getElementById("hero-temp").textContent = `${data.temp}°C`;
  document.getElementById("hero-summary").textContent = generateSummary(data);
  document.getElementById("hero-icon").setAttribute("data-lucide", theme.icon);
  document.getElementById("hero-icon").style.color = theme.accent;

  document.getElementById("stat-humidity").textContent = `${data.humidity}%`;
  document.getElementById("stat-wind").textContent = `${data.wind} km/h`;
  document.getElementById("stat-rain").textContent = `${data.chanceOfRain}%`;
  document.getElementById("stat-updated").textContent = data.updated || "--";

  document.getElementById("stars").classList.toggle("visible", !data.isDay);

  const blobs = document.querySelectorAll(".glow-blob");
  blobs.forEach((b, i) => {
    b.style.background = `radial-gradient(circle, ${theme.glow[i]} 0%, transparent 70%)`;
  });

  const timeline = document.getElementById("timeline");
  timeline.innerHTML = "";
  data.periods.forEach((p, i) => {
    const card = document.createElement("div");
    card.className = `fade-in delay-${Math.min(i + 1, 3)} card-hover rounded-2xl border border-current/10 bg-white/30 backdrop-blur-md p-4 flex flex-col items-center gap-2 text-center`;
    card.innerHTML = `
      <span class="text-xs uppercase tracking-wide font-medium opacity-50">${p.name}</span>
      <i data-lucide="${p.icon}" class="w-7 h-7" style="color:${theme.accent}"></i>
      <span class="font-display text-2xl font-bold">${p.temp}°</span>
      <span class="text-xs font-medium opacity-70">${p.condition}</span>
    `;
    timeline.appendChild(card);
  });

  setBaseLayer(!data.isDay || data.condition === "rainy");
  lucide.createIcons();
}

/* Populate Locality Select */
const select = document.getElementById("locality-select");
LOCALITIES.forEach((loc, i) => {
  const opt = document.createElement("option");
  opt.value = i;
  opt.textContent = loc.name;
  select.appendChild(opt);
});

async function loadLocality(index) {
  const loc = LOCALITIES[index];
  document.getElementById("hero-summary").textContent = `Checking ${loc.name}...`;
  try {
    const raw = await fetchOpenMeteo(loc.lat, loc.lon);
    const data = transformOpenMeteo(raw, loc.name);
    render(data);
    recenterMap(loc.lat, loc.lon);
  } catch (err) {
    console.error(err);
    render({ ...fallbackData, locationName: loc.name });
  }
}

select.addEventListener("change", (e) => loadLocality(Number(e.target.value)));

document.getElementById("tech-toggle").addEventListener("click", () => {
  document.getElementById("tech-panel").classList.toggle("hidden");
  document.getElementById("tech-chevron").classList.toggle("rotate-180");
});

/* Zero-Flicker Smooth Radar Loop */
async function initRadar() {
  try {
    const res = await fetch("https://api.rainviewer.com/public/weather-maps.json");
    const data = await res.json();
    
    // Combine past 2 hours + nowcast 30 mins
    const frames = [...(data.radar.past || []), ...(data.radar.nowcast || [])];
    if (!frames.length) return;

    // Pre-create all tile layers with opacity 0 to avoid flickers
    const layers = frames.map((frame) => {
      const tileUrl = `https://tilecache.rainviewer.com/v2/radar/${frame.time}/256/{z}/{x}/{y}/2/1_1.png`;
      const layer = L.tileLayer(tileUrl, {
        opacity: 0,
        maxNativeZoom: 8,
        minZoom: 5,
      }).addTo(map);
      return { layer, time: frame.time };
    });

    let currentIdx = 0;
    layers[0].layer.setOpacity(0.65);

    setInterval(() => {
      layers[currentIdx].layer.setOpacity(0);
      currentIdx = (currentIdx + 1) % layers.length;
      layers[currentIdx].layer.setOpacity(0.65);

      const d = new Date(layers[currentIdx].time * 1000);
      const isNowcast = currentIdx >= (data.radar.past ? data.radar.past.length : 0);
      const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      
      const timeBadge = document.getElementById("radar-timestamp");
      if (timeBadge) {
        timeBadge.textContent = `${isNowcast ? 'FORECAST' : 'RADAR'} ${timeStr}`;
        timeBadge.style.color = isNowcast ? '#38BDF8' : 'inherit';
      }
    }, 1200);

  } catch (e) {
    console.error("Radar initialization error:", e);
  }
}

async function loadCentralWeather() {
  try {
    const res = await fetch("weather.json?t=" + Date.now());
    if (!res.ok) throw new Error("weather.json not found");
    const data = await res.json();
    const raw = await fetchOpenMeteo(LOCALITIES[0].lat, LOCALITIES[0].lon);
    data.periods = buildPeriods(raw.hourly);
    data.updated = data.generatedAt ? data.generatedAt.slice(11, 16) : "--:--";
    data.locationName = "Hyderabad (Central)";
    render(data);
    recenterMap(LOCALITIES[0].lat, LOCALITIES[0].lon);
  } catch (err) {
    loadLocality(0);
  }
}

initRadar();
loadCentralWeather();
</script>

</body>
</html>
