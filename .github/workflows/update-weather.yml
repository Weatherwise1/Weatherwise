name: Update Weather Data

on:
  schedule:
    # Runs at minute 0 and 30 of every hour
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows you to click "Run workflow" manually from the Actions tab

# This is the missing block! It grants the bot permission to push to your repository.
permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Multi-Model Ensemble
        env:
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          TOMORROW_KEY: ${{ secrets.TOMORROW_KEY }}
        # If fetch-weather.js throws an error, the job stops here. Old data is preserved.
        run: node fetch-weather.js

      - name: Validate JSON Payload
        # Strictly ensures the output is valid JSON and not empty/corrupted
        run: |
          if ! jq . weather.json > /dev/null 2>&1; then
            echo "Error: weather.json is corrupted or empty. Aborting commit to protect production."
            exit 1
          fi

      - name: Commit and Push (If Changed)
        run: |
          git config --global user.name "WeatherWise Bot"
          git config --global user.email "actions@github.com"
          git add weather.json
          
          # Only commit if git detects actual changes to the file
          git diff --staged --quiet || (git commit -m "chore: update weather data [skip ci]" && git push)