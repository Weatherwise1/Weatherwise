name: Update Weather Data

on:
  schedule:
    # Runs at minute 14 and 44 of every hour to avoid GitHub's queue delays
    - cron: '14,44 * * * *' 
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # THIS GRANTS THE BOT PERMISSION TO PUSH THE FILES (Fixes Exit Code 128)
    permissions:
      contents: write

    steps:
      # Upgraded to v4 to remove the yellow deprecation warning
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run weather fetcher
        env:
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          TOMORROW_KEY: ${{ secrets.TOMORROW_KEY }}
        run: node fetch-weather.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add weather.json history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update weather and history data"
          git push