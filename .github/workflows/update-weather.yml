name: Update Weather Data

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours, all day, every day
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write            # allows the bot to push weather.json back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run weather fetch + reconciliation script
        env:
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          TOMORROW_KEY: ${{ secrets.TOMORROW_KEY }}
        run: node fetch-weather.js

      - name: Commit and push weather.json if it changed
        run: |
          git config user.name "weatherwise-bot"
          git config user.email "actions@github.com"
          git add weather.json
          git diff --staged --quiet || git commit -m "Auto-update weather.json [skip ci]"
          git push